server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite SPA static bundle (assetsDir = spa-assets, see vite.config.ts).
    location /spa-assets/ {
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    # SocketIO - requires WebSocket upgrade. Backend + this proxy are unchanged.
    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend REST API - explicit prefixes proxied to Flask. Everything else
    # falls through to the SPA. Keeps the existing backend reachable verbatim.
    location ~ ^/(health|config|state|objects|arms|assets|demo|topology|run_script|object_event|set_angle|log|reload_config|restart_pipeline|pipeline|actor_scripts|deploy|runtime|execute_task|scripts|plan|interpret|negotiate|bus|reservations|agv|ai|grid|coord) {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback - client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
