services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - ${OLLAMA_HOST_PORT:-11434}:11434
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  backend:
    build: .
    container_name: interact-backend
    ports:
      - ${BACKEND_HOST_PORT:-5000}:5000
    environment:
      - SERVER_HOST=http://backend:5000
      - DEMO_RUNNER_HOST=http://demo-runner:6000
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:0.5b
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
      # Phase 7: enable real docker stop/start for module failure routes.
      - CONTAINER_CONTROL=on
      - COMPOSE_CONTAINER_PREFIX=interact
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health',
          timeout=3).read()
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      ollama:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - 8080:80
    depends_on:
      backend:
        condition: service_healthy
  demo-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo-runner
    container_name: interact-demo-runner
    ports:
      - ${DEMO_RUNNER_HOST_PORT:-6000}:6000
    environment:
      - SERVER_HOST=http://backend:5000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:6000/health',
          timeout=3).read()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    depends_on:
      backend:
        condition: service_healthy
  arm-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.arm
    container_name: interact-arm-1
    ports:
      - 8001:8000
    environment:
      - ARM_ID=1
      - SERVER_HOST=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
  arm-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.arm
    container_name: interact-arm-2
    ports:
      - 8002:8000
    environment:
      - ARM_ID=2
      - SERVER_HOST=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
  arm-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.arm
    container_name: interact-arm-3
    ports:
      - 8003:8000
    environment:
      - ARM_ID=3
      - SERVER_HOST=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy

  # ── Phase 6: containerized non-arm assets ─────────────────────────
  # Each asset service runs the same VehicleController / ConveyorController
  # in its own process. /health, /object, /fail, /recover endpoints mirror
  # the arm container API. Killing the container behaves identically to
  # killing an arm — backend health monitor sees missed pings and marks
  # the asset failed, propagating to the frontend over `asset_health`.
  veh-a:
    build:
      context: .
      dockerfile: docker/Dockerfile.asset
    container_name: interact-veh-a
    ports:
      - 8010:8000
    environment:
      - ASSET_TYPE=vehicle
      - ASSET_ID=veh-a
      - ASSET_LABEL=Shuttle A
      - SERVER_HOST=http://backend:5000
      - SPEED_FACTOR=1.0
      - TRAVEL_TIME=2.0
      - UPSTREAM_URL=http://arm-2:8000
      - DOWNSTREAM_URL=http://conv-1:8000
    depends_on:
      backend:
        condition: service_healthy

  conv-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.asset
    container_name: interact-conv-1
    ports:
      - 8020:8000
    environment:
      - ASSET_TYPE=conveyor
      - ASSET_ID=conv-1
      - ASSET_LABEL=Belt 1
      - SERVER_HOST=http://backend:5000
      - SPEED_FACTOR=1.0
      - SLOT_COUNT=4
      - SHIFT_INTERVAL=1.2
      - UPSTREAM_URL=http://veh-a:8000
      - DOWNSTREAM_URL=http://arm-3:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ollama_data:
