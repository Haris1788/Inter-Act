services:
  backend:
    build: .
    ports:
    - ${BACKEND_HOST_PORT:-5000}:5000
    environment:
    - SERVER_HOST=http://backend:5000
    - DEMO_RUNNER_HOST=http://demo-runner:6000
    - FLASK_ENV=production
    - FLASK_DEBUG=0
    - PYTHONUNBUFFERED=1
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:5000/health',
        timeout=3).read()
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
    - 8080:80
    depends_on:
      backend:
        condition: service_healthy
  demo-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo-runner
    ports:
    - ${DEMO_RUNNER_HOST_PORT:-6000}:6000
    environment:
    - SERVER_HOST=http://backend:5000
    - PYTHONUNBUFFERED=1
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:6000/health',
        timeout=3).read()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    depends_on:
      backend:
        condition: service_healthy
  arm-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.arm
    ports:
    - 8001:8000
    environment:
    - ARM_ID=1
    - SERVER_HOST=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
  arm-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.arm
    ports:
    - 8002:8000
    environment:
    - ARM_ID=2
    - SERVER_HOST=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
  arm-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.arm
    ports:
    - 8003:8000
    environment:
    - ARM_ID=3
    - SERVER_HOST=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
