services:
  # NOTE: the embedded ollama service was removed (Phase 5 cleanup). All
  # LLM traffic flows through host.docker.internal:11500 to the
  # TU Clausthal tunnel (qwq:32b + qwen2.5:14b). Saves GPU/CPU + build
  # time and removes a vestigial container. Any legacy
  # OLLAMA_BASE_URL reader now resolves to the same tunnel via the
  # backend env below.
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --appendonly
    - "yes"
    - --appendfsync
    - everysec
    volumes:
    - redis-data:/data
    ports:
    - "6379:6379"
    restart: unless-stopped
  backend:
    build: .
    container_name: interact-backend
    ports:
    - ${BACKEND_HOST_PORT:-5000}:5000
    environment:
    - SERVER_HOST=http://backend:5000
    - DEMO_RUNNER_HOST=http://demo-runner:6000
    - OLLAMA_BASE_URL=http://host.docker.internal:11500
    - LLM_BASE_URL=http://host.docker.internal:11500
    - OLLAMA_MODEL_PLANNER=qwq:32b-q4_K_M
    - OLLAMA_MODEL_TACTICAL=qwen2.5:14b-instruct-q4_K_M
    - PIPELINE_CONFIG=/config/pipeline.yaml
    - FLASK_ENV=production
    - FLASK_DEBUG=0
    - PYTHONUNBUFFERED=1
    - CONTAINER_CONTROL=on
    - COMPOSE_CONTAINER_PREFIX=interact
    - REDIS_URL=redis://redis:6379/0
    - INTERACT_BUS=redis
    - INTERACT_STATE=redis
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./pipeline.yaml:/config/pipeline.yaml:rw
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:5000/health',
        timeout=3).read()
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      redis:
        condition: service_started
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
    - 8080:80
    depends_on:
      backend:
        condition: service_healthy
  demo-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo-runner
    container_name: interact-demo-runner
    ports:
    - ${DEMO_RUNNER_HOST_PORT:-6000}:6000
    environment:
    - SERVER_HOST=http://backend:5000
    - PIPELINE_CONFIG=/config/pipeline.yaml
    - PYTHONUNBUFFERED=1
    volumes:
    - ./pipeline.yaml:/config/pipeline.yaml:ro
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:6000/health',
        timeout=3).read()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    depends_on:
      backend:
        condition: service_healthy
  # interact-shared-actor: build target so `docker compose build actor-image`
  # pre-builds the image that container_manager.reconcile_actors() uses for
  # arm + agv containers.  NOT a running service — containers are
  # reconciler-owned ephemeral entities, never compose services.
  actor-image:
    build:
      context: .
      dockerfile: Dockerfile.actor
    image: interact-shared-actor:latest
    profiles:
    - build-only
volumes:
  redis-data: {}
