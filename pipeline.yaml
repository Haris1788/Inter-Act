pipeline:
  mode: dependency
  products: 6
  speed: normal
failure_policy:
  default: isolate
  retry_max: 3
  retry_delay: 2.0
health:
  check_interval: 2.0
  timeout: 5.0
  max_missed: 3
arms:
- id: 1
  label: Input Arm
  color: '#e74c3c'
  depends_on: []
  critical: true
- id: 2
  label: Output Arm
  color: '#2ecc71'
  depends_on:
  - 1
  critical: true
assets: []
