# INTER.act Pipeline Configuration
# Edit this file to add/remove arms, change modes, or set failure policies.
# Then run: python scripts/generate_compose.py && docker compose up --build

pipeline:
  mode: dependency # sequential | parallel | dependency (DAG-based)
  products: 3
  speed: normal # fast | normal | slow

failure_policy:
  default: isolate # stop | skip | retry | isolate
  retry_max: 3
  retry_delay: 2.0

health:
  check_interval: 2.0
  timeout: 5.0
  max_missed: 3

# Canvas size is auto-computed from arm count. Remove these to use defaults.
# canvas:
#   width: 1920
#   height: 720

arms:
  - id: 1
    label: "Arm 1"
    color: "#e74c3c"
    depends_on: []
    critical: true

  - id: 2
    label: "Arm 2"
    color: "#2ecc71"
    depends_on: [1]
    critical: true

  - id: 3
    label: "Arm 3"
    color: "#3498db"
    depends_on: [2]
    critical: true
